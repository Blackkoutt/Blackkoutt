name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23F08A4B&color_dots=%23EBEDF0,%23704b3e,%239b6043,%23c57547,%23f08a4b
            dist/github-snake-dark.svg?palette=github-dark&color_snake={{SNAKE}}&color_dots=%231C1923,%234d393b,%23704b3e,%239b6043,%23c57547

      - uses: crazy-max/ghaction-github-pages@v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
