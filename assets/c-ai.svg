<svg xmlns="http://www.w3.org/2000/svg" width="500" height="250" viewBox="-10 0 500 250" role="img" aria-label="AI-assisted work: Using Claude Code and skills, building my own MCP servers to speed up my everyday work">
  <style>text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; } .mono { font-family: "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo, Consolas, monospace; } .bob { animation: bob 1.8s ease-in-out infinite; } @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
      .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; } @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
      .aRu { animation: au 1.6s steps(1) infinite; } .aR { animation: ad 1.6s steps(1) infinite; }
      @keyframes au { 0%,32% { opacity: 1; } 33%,100% { opacity: 0; } } @keyframes ad { 0%,32% { opacity: 0; } 33%,100% { opacity: 1; } }
      .tx { opacity: 0; animation: tx 4.8s linear infinite; } @keyframes tx { 0% { transform: translateX(0); opacity: 0; } 3% { opacity: 1; } 46% { opacity: 1; } 50%,100% { transform: translateX(52px); opacity: 0; } }
      .ty { animation: ty 4.8s linear infinite; } @keyframes ty { 0% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); } 22% { transform: translateY(-48px); animation-timing-function: ease-in; } 50%,100% { transform: translateY(-26px); } }
      .st { transform-box: fill-box; transform-origin: center; animation: st 3s ease-out infinite; } @keyframes st { 0% { transform: translateY(0) scale(.8); opacity: 0; } 20% { opacity: .95; } 100% { transform: translateY(-30px) scale(1.15); opacity: 0; } }
      .fire { transform-box: fill-box; transform-origin: center bottom; animation: fire .7s ease-in-out infinite; } @keyframes fire { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.65); } }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop 1.6s ease-out infinite; } @keyframes pop { 0% { transform: scale(0); opacity: 0; } 40% { transform: scale(1); opacity: .9; } 70%,100% { transform: scale(1.5); opacity: 0; } }
      .tb1, .tb2 { transform-box: fill-box; transform-origin: left center; animation-duration: 12s; animation-timing-function: steps(11, end); animation-iteration-count: infinite; }
      .tb1 { animation-name: tb1; } .tb2 { animation-name: tb2; }
      @keyframes tb1 { 0% { transform: scaleX(0); } 12% { transform: scaleX(1); } 44% { transform: scaleX(1); } 47%,100% { transform: scaleX(0); } }
      @keyframes tb2 { 0%,50% { transform: scaleX(0); } 62% { transform: scaleX(1); } 94% { transform: scaleX(1); } 97%,100% { transform: scaleX(0); } } </style>
