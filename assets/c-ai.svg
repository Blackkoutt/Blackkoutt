    <rect x="306" y="198" width="16" height="8" fill="#985a37"/><rect x="338" y="198" width="16" height="8" fill="#985a37"/><g class="tx" style="animation-delay:0s"><g class="ty" style="animation-delay:0s"><text class="mono" x="374" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#F08A4B">await</text></g></g><g class="tx" style="animation-delay:1.6s"><g class="ty" style="animation-delay:1.6s"><text class="mono" x="374" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#F08A4B">var</text></g></g><g class="tx" style="animation-delay:3.2s"><g class="ty" style="animation-delay:3.2s"><text class="mono" x="374" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#F08A4B">async</text></g></g>
